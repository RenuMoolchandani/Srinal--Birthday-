
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 26th Birthday Srinal! 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background-color: #8b0000; color: #ffffff; overflow-x: hidden; min-height: 100vh; }
        .screen { width: 100vw; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; position: absolute; top: 0; left: 0; transition: opacity 0.8s ease, transform 0.8s ease; background-color: #900c3f; }
        .hidden { opacity: 0; pointer-events: none; transform: scale(0.95); z-index: -1; }
        .active { opacity: 1; pointer-events: all; transform: scale(1); z-index: 10; }
        .title-script { font-family: 'Dancing Script', cursive; font-size: 3.5rem; color: #fff; text-shadow: 2px 2px 10px rgba(0,0,0,0.4); margin-bottom: 25px; text-align: center; }
        .envelope-container { cursor: pointer; text-align: center; animation: pulse 2s infinite; }
        .envelope { width: 280px; height: 180px; background: #c70039; position: relative; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; border: 2px solid #e91e63; }
        .envelope::before { content: ''; position: absolute; top: 0; left: 0; width: 0; height: 0; border-left: 140px solid transparent; border-right: 140px solid transparent; border-top: 100px solid #a00028; }
        .wax-seal { width: 65px; height: 65px; background: linear-gradient(135deg, #ffd700, #ff8c00); border-radius: 50%; position: absolute; z-index: 2; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.4); border: 2px solid #fff; font-size: 24px; }
        .instruction { margin-top: 25px; font-size: 1.2rem; letter-spacing: 1px; color: #ffe4e1; }
        .greeting-card { background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(10px); padding: 40px 30px; border-radius: 20px; max-width: 600px; width: 90%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); }
        .hero-img { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; object-position: center top; border: 4px solid #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .btn-custom { background: linear-gradient(45deg, #ff4081, #ff6b6b); color: white; border: none; padding: 12px 35px; font-size: 1.1rem; border-radius: 30px; cursor: pointer; margin-top: 25px; box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4); transition: transform 0.2s, box-shadow 0.2s; font-weight: 600; }
        .gift-grid { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; max-width: 900px; margin-top: 30px; }
        .gift-card { background: rgba(255, 255, 255, 0.95); color: #333; width: 220px; padding: 30px 20px; border-radius: 16px; cursor: pointer; text-align: center; transition: all 0.3s ease; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .gift-icon { font-size: 50px; margin-bottom: 15px; }
        .gift-card h3 { font-size: 1.3rem; color: #900c3f; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 100; display: flex; justify-content: center; align-items: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal-body { background: #fff; color: #222; width: 100%; max-width: 800px; max-height: 85vh; overflow-y: auto; border-radius: 20px; padding: 35px 25px; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; background: none; border: none; color: #666; cursor: pointer; }
        .main-letter { font-family: 'Sacramento', cursive; font-size: 1.8rem; line-height: 1.6; color: #4a0e17; background: #fff9f9; padding: 25px; border-radius: 12px; border-left: 5px solid #ff4081; text-align: left; margin-bottom: 30px; }
        .side-quotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
        .quote-box { background: #fff0f3; padding: 15px 20px; border-radius: 10px; font-size: 0.95rem; color: #721c24; border: 1px dashed #ffb3c1; font-style: italic; text-align: left; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding: 15px 0; }
        .polaroid { background: white; padding: 12px 12px 25px 12px; box-shadow: 0 8px 15px rgba(0,0,0,0.15); transform: rotate(-2deg); transition: transform 0.3s ease; border: 1px solid #eee; }
        .polaroid img { width: 100%; height: 220px; object-fit: contain; background-color: #f9f9f9; border-radius: 4px; }
        .caption-text { color: #444; font-size: 0.85rem; margin-top: 10px; text-align: center; font-weight: 500; line-height: 1.3; }
        .flower-container { text-align: center; }
        .bouquet-img { font-size: 80px; margin-bottom: 20px; }
        .wishes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .wish-card { background: #ffe6ea; color: #800020; padding: 15px; border-radius: 12px; font-size: 0.95rem; font-weight: 500; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .vinyl-container { text-align: center; padding: 20px; }
        .vinyl-record { width: 180px; height: 180px; background: radial-gradient(circle, #333 30%, #111 70%); border-radius: 50%; margin: 0 auto 20px auto; display: flex; justify-content: center; align-items: center; border: 4px solid #222; box-shadow: 0 10px 25px rgba(0,0,0,0.4); animation: spin 4s linear infinite; }
        .vinyl-center { width: 60px; height: 60px; background: #ff4081; border-radius: 50%; border: 5px solid #fff; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <!-- Updated audio sources to match the exact uploaded filename from your GitHub screenshot -->
    <audio id="bg-music" loop playsinline preload="auto">
        <source src="https://files.catbox.moe/k3z3vg.mp3" type="audio/mpeg">
        <source src="Edd_Sheeran_-_Perfect_(mp3.pm).mp3.mp3" type="audio/mpeg">
        <source src="Edd_Sheeran_-_Perfect_(mp3.pm).mp3" type="audio/mpeg">
    </audio>

    <div id="screen-envelope" class="screen active">
        <h1 class="title-script">Happy 26th Birthday!</h1>
        <div class="envelope-container" onclick="goToGreeting()">
            <div class="envelope"><div class="wax-seal">💌</div></div>
            <p class="instruction">Click the seal to open</p>
        </div>
    </div>
    <div id="screen-greeting" class="screen hidden">
        <div class="greeting-card">
            <img src="./Pic7.jpg" class="hero-img" alt="Srinal">
            <h1 class="title-script" style="color:#fff; margin-bottom:10px;">Happy Birthday Srinal! 🎉</h1>
            <p style="font-size: 1.1rem; color: #ffd1dc;">You are turning 26 today! Here is a little world built just for you 💖</p>
            <button class="btn-custom" onclick="goToMenu()">Click here for your gifts</button>
        </div>
    </div>
    <div id="screen-menu" class="screen hidden">
        <h2 class="title-script">These are for you ✨</h2>
        <div class="gift-grid">
            <div class="gift-card" onclick="openModal('message')">
                <div class="gift-icon">💌</div>
                <h3>Message</h3>
                <p style="font-size:0.85rem; color:#666; margin-top:5px;">From the heart</p>
            </div>
            <div class="gift-card" onclick="openModal('flower')">
                <div class="gift-icon">💐</div>
                <h3>Flower & Wishes</h3>
                <p style="font-size:0.85rem; color:#666; margin-top:5px;">Sweet notes for you</p>
            </div>
            <div class="gift-card" onclick="openModal('music')">
                <div class="gift-icon">🎵</div>
                <h3>Our Song</h3>
                <p style="font-size:0.85rem; color:#666; margin-top:5px;">Lover by Taylor Swift</p>
            </div>
        </div>
    </div>
    <div id="modal" class="modal-overlay">
        <div class="modal-body">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div id="modal-content"></div>
        </div>
    </div>
    <script>
        const bgMusic = document.getElementById('bg-music');

        function playMusic() { 
            if (bgMusic) {
                bgMusic.currentTime = bgMusic.currentTime || 0;
                let playPromise = bgMusic.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        console.log("Audio playing perfectly!");
                    }).catch(error => {
                        console.log("Autoplay retry fallback active:", error);
                        bgMusic.load();
                        bgMusic.play().catch(e => console.log("Play failed:", e));
                    });
                }
            }
        }
        
        function pauseMusic() { 
            if (bgMusic) {
                bgMusic.pause(); 
            }
        }

        function goToGreeting() { 
            playMusic(); 
            document.getElementById('screen-envelope').classList.replace('active', 'hidden'); 
            document.getElementById('screen-greeting').classList.replace('hidden', 'active'); 
        }

        function goToMenu() { 
            playMusic();
            document.getElementById('screen-greeting').classList.replace('hidden', 'active'); 
            document.getElementById('screen-menu').classList.replace('hidden', 'active'); 
        }

        function openModal(type) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            
            if (type === 'music') {
                pauseMusic(); 
                content.innerHTML = `
                    <div class="vinyl-container">
                        <h2 class="title-script" style="color:#900c3f; font-size:2.5rem;">This Song Reminds Me of You 🎶</h2>
                        <div class="vinyl-record"><div class="vinyl-center"></div></div>
                        <h3 style="color:#333; margin-bottom:10px;">Lover — Taylor Swift</h3>
                        <p style="color:#666; font-size:0.95rem; margin-bottom:20px;">"Can I go where you go? Could we always be this close...?"</p>
                        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/1dGr1c8CrMLDpV6mPbImSI?utm_source=generator" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                    </div>`;
            } else if (type === 'message') {
                content.innerHTML = `
                    <h2 class="title-script" style="color:#900c3f; font-size:2.5rem; text-align:center;">Happiest Birthday Srinal! 💖</h2>
                    <div class="main-letter">Happiest Birthday Meri Jaan .<br><br>I know last time I was with you but this time it's not the same but relax girl u will always be the best gift of my life 💓.<br><br>I am soo lucky to have u not only as my best friend but also someone whom I love the most and I want to cherish every day, every second, every year.<br><br>Love u Meri Janu 🩷</div>
                    <h3 style="color:#900c3f; margin-bottom:15px; text-align:center;">Our Memories Gallery 📸</h3>
                    <div class="gallery-grid">
                        <div class="polaroid"><img src="./Pic1.jpg"><p class="caption-text">Taking my most precious person to the place I love the most . Best pic😇</p></div>
                        <div class="polaroid"><img src="./Pic2.jpg"><p class="caption-text">Sunshine 🌞 🩷 Sweet cheeks</p></div>
                        <div class="polaroid"><img src="./Pic3.jpg"><p class="caption-text">Chatorees In Chandani Chowk 😋</p></div>
                        <div class="polaroid"><img src="./Pic4.jpg"><p class="caption-text">🌸♾️💕</p></div>
                        <div class="polaroid"><img src="./Pic5.jpg"><p class="caption-text">Busy in booking my heart 🩷</p></div>
                        <div class="polaroid"><img src="./Pic6.jpg"><p class="caption-text">Meri Sanskari Sundari 🎀</p></div>
                        <div class="polaroid"><img src="./Pic7.jpg"><p class="caption-text">Sexy gurl slaying every night 🌸</p></div>
                        <div class="polaroid"><img src="./Pic8.jpg" onerror="this.src='./pic8.jpg'"><p class="caption-text">Pretty girl I want to see every morning 💐</p></div>
                        <div class="polaroid"><img src="./Pic9.jpg"><p class="caption-text">Mohabaat Zindabad ♾️</p></div>
                        <div class="polaroid"><img src="./Pic10.jpg"><p class="caption-text">Reflection is enough to claim my right on the most gorgeous girl in the town 💗</p></div>
                    </div>
                    <h3 style="color:#900c3f; margin:25px 0 15px 0; text-align:center;">Special Messages 📜</h3>
                    <div class="side-quotes">
                        <div class="quote-box">"Rab se manga tha bs ek yaar usne tumhe thama diya . Manga tha bs thoda sa pyaar tune mujhe apna dildaar bna diya ."</div>
                        <div class="quote-box">"Teri har choti muskan mere liye hira hai tujhe payaa toh lga tu hi mera sona hai ."</div>
                        <div class="quote-box">"Jeevan bhr saath rahu ya nhi jab tk hu bs teri hi rahu yhi tammana hai .❣️"</div>
                        <div class="quote-box">"Tumhara mera milna likha tha us din . Tere bina guzara adhura tha har din."</div>
                        <div class="quote-box">"Teri muskurahat hai takat meri . Har din jeene ki cha mujhe ise milli."</div>
                        <div class="quote-box">"Sath ho tu mere har us pal me jisme mai Zinda hu , meri har jeet meri har kushi bs tujhse hai judi hui kyuki tu meri zindagi."</div>
                        <div class="quote-box">"Nh jane ham agle janam mile ya nh mile lekin is janam tu sirf meri thi aur meri rahi."</div>
                    </div>`;
            } else if (type === 'flower') {
                content.innerHTML = `<div class="flower-container"><h2 class="title-script" style="color:#900c3f; font-size:2.5rem;">A Bouquet of Love for Srinal 🌻🌸</h2><div class="bouquet-img">💐</div><div class="wishes-grid"><div class="wish-card">✨ You are turning 26 today and glowing brighter than ever!</div><div class="wish-card">💖 Your smile has the magic to light up the darkest room.</div><div class="wish-card">🌟 You are unique, kind, and genuinely irreplaceable.</div><div class="wish-card">🎂 May this 26th year bring you boundless happiness & dreams come true!</div><div class="wish-card">🌷 You are capable of achieving everything your heart desires.</div><div class="wish-card">🎀 Staying true to yourself is your biggest superpower.</div></div></div>`;
            }
            modal.classList.add('open');
        }

        function closeModal() { 
            document.getElementById('modal').classList.remove('open'); 
            playMusic(); 
        }
    </script>
</body>
</html>
